name: test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one platform's failure must not hide another's
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      # `lore wiki init` commits, and a bare runner has no git identity where
      # any real machine does. Without this the wiki tests fail on the commit,
      # not on anything they mean to assert.
      - name: git identity
        run: |
          git config --global user.email lore-ci@example.invalid
          git config --global user.name "lore CI"

      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit

      # TZ pinned: `bun test` forces the JS side to UTC but leaves SQLite's
      # `localtime` on the OS zone, so an UNPINNED run has the two halves
      # disagreeing and the day-bucket tests cannot hold them to each other.
      - run: bun test
        env:
          TZ: UTC

      # UTC hides every day-bucket regression, because there a local day and a
      # UTC day are the same day. This second pass is the one that would catch
      # one. POSIX only: Windows does not take its zone from TZ, so pinning it
      # there would move the JS half and leave SQLite on the runner's clock —
      # the exact mismatch, manufactured.
      - run: bun test
        if: runner.os != 'Windows'
        env:
          TZ: Pacific/Kiritimati

      # The tests drive the request handler directly and never open a port.
      # This boots the explorer for real and fetches it — the dashboard is the
      # thing people actually use, so "it serves on Windows" should be a
      # measurement, not a claim.
      - name: the explorer serves
        run: bun scripts/smoke-serve.ts

      # The installer is the one thing unit tests can't reach: it writes a
      # platform-specific shim (#!/bin/sh vs .cmd) and produces the artifact
      # every session actually runs. Build it, then execute what it installed.
      # install.ts gates on a clean tree, which a fresh checkout is.
      - name: install the frozen bin
        run: bun scripts/install.ts

      - name: the installed bin answers
        if: runner.os != 'Windows'
        run: "$HOME/.bun/bin/lore --version"

      - name: the installed bin answers
        if: runner.os == 'Windows'
        shell: pwsh
        # Quoted: a bare leading '&' is a YAML anchor indicator, not a string.
        run: '& "$env:USERPROFILE\.bun\bin\lore.cmd" --version'
